name: Bug report
description: The CLI, installer or Skill does not behave as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vulnograph --version`, or a commit SHA.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran. Do not include tokens or API keys.
      placeholder: vulnograph fetch CVE-2026-109618 --output reports/CVE-2026-109618/evidence.json
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exit code, stderr and relevant parts of the JSON (sources, warnings, state).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, and the Skill client (Claude Code or Codex) if relevant.
