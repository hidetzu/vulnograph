name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Offline baseline matches golden evidence
        run: |
          go run ./cmd/vulnograph fetch CVE-2026-109618 --fixture testdata/CVE-2026-109618 > /tmp/evidence.json
          diff -u testdata/CVE-2026-109618/evidence.golden.json /tmp/evidence.json
